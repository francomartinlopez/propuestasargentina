<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gracias · 100 propuestas</title>
<style>
@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:400;font-display:swap;src:url(/fuentes/plus-jakarta-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:500;font-display:swap;src:url(/fuentes/plus-jakarta-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:600;font-display:swap;src:url(/fuentes/plus-jakarta-sans-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:700;font-display:swap;src:url(/fuentes/plus-jakarta-sans-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:800;font-display:swap;src:url(/fuentes/plus-jakarta-sans-latin-800-normal.woff2) format('woff2')}

:root{--paper:#fff;--ink:#111;--muted:#5b5b5b;--grad:linear-gradient(115deg,#f9b50f 0%,#eb671c 34%,#e84f2b 68%,#e84b49 100%)}
@media (prefers-color-scheme:dark){:root{--paper:#0e0e0e;--ink:#f2f2f2;--muted:#a6a6a6}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:16px/1.6 "Plus Jakarta Sans",system-ui,sans-serif;padding:24px}
.box{max-width:520px;text-align:center}
.sol{width:64px;height:32px;margin:0 auto 18px;border-radius:64px 64px 0 0;background:var(--grad)}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin:0}
p{color:var(--muted)}
a{display:inline-block;margin-top:18px;font-weight:800;color:var(--paper);background:var(--ink);padding:12px 22px;border-radius:999px;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <div class="sol"></div>
  <h1>¡Gracias por escribirnos!</h1>
  <p>Recibimos tu mensaje. Lo leemos todo y te respondemos al contacto que dejaste.</p>
  <a href="/">Volver a las propuestas</a>
</div>
</body>
</html>
